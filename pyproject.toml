[project]
name = "smolvla-mlx"
version = "0.1.0"
description = "SmolVLA inference on MLX with FoldQuantVLA-inspired PTQ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.3",
    "numpy>=2.0,<3",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-benchmark>=5.0", "ruff>=0.8"]
reference = [
    "torch==2.11.0",
    "transformers==5.5.0",
    "datasets==5.0.1",
    "av>=14,<16",
    "lerobot[smolvla] @ git+https://github.com/huggingface/lerobot.git@e0d50211ef236143ae867228662b7dfaba554f02",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
smolvla-mlx = "smolvla_mlx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["models/smolvla/src/smolvla_mlx"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# This runtime targets native Apple Silicon only. Restricting lock resolution
# avoids selecting LeRobot's Linux-only CUDA torch source.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["models/smolvla/tests", "models/gr00t/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
